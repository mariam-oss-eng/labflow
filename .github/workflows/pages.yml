name: Pages

# Build the MkDocs Material site and publish it to GitHub Pages on every
# push to main. The `pages-build-deployment` action is the official
# pattern recommended in the GitHub Pages docs; we don't gh-pages-branch
# anymore because the artifact-based workflow is faster and avoids the
# noisy commit history a `gh-pages` branch creates.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install MkDocs Material
        run: |
          python -m pip install --upgrade pip
          pip install \
            "mkdocs-material>=9.5,<10" \
            "pymdown-extensions>=10,<11"

      - name: Build site
        run: mkdocs build -f docs/mkdocs.yml -d ../site --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
