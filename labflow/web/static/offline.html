<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabFlow — Offline</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-slate-900 text-slate-100">
  <main class="max-w-xl mx-auto px-6 py-24 text-center">
    <h1 class="text-3xl font-bold mb-2">You're offline</h1>
    <p class="text-slate-400 mb-8">
      LabFlow couldn't reach the server. Cached pages may still be available
      from your browser history. Reconnect and refresh to sync.
    </p>
    <p>
      <a href="/" class="inline-block bg-sky-600 hover:bg-sky-500 text-white px-4 py-2 rounded">
        Try again
      </a>
    </p>
  </main>
</body>
</html>
