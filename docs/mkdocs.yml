site_name: LabFlow
site_description: Meeting → execution OS for research and technical teams
site_url: https://mariam-oss-eng.github.io/labflow/
repo_url: https://github.com/mariam-oss-eng/labflow
repo_name: mariam-oss-eng/labflow
edit_uri: edit/main/docs/
docs_dir: .

# Theme — Material is the most-deployed mkdocs theme; everything below
# works with the open-source build (no Insiders features used).
theme:
  name: material
  language: en
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github
    logo: material/flask-outline

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mariam-oss-eng/labflow
  generator: false

nav:
  - Home: index.md
  - Getting started:
      - Onboarding: onboarding.md
      - Operations: operations.md
      - Pricing: pricing.md
  - Architecture:
      - Overview: architecture.md
      - Product spec: product_spec.md
      - ADRs:
          - Index: adr/index.md
          - "0001 · Hybrid search ranking": adr/0001-hybrid-search.md
          - "0002 · Idempotency middleware": adr/0002-idempotency-middleware.md
          - "0003 · Encryption at rest": adr/0003-encryption-at-rest.md
          - "0004 · Collaboration model": adr/0004-collaboration-model.md
          - "0005 · WebSocket vs SSE": adr/0005-websocket-vs-sse.md
          - "0006 · Hand-rolled GraphQL": adr/0006-hand-rolled-graphql.md
  - Reference:
      - REST API: api.md
      - GraphQL: graphql.md
      - Realtime (SSE + WebSocket): realtime.md
      - Analytics: analytics.md
      - Collaboration: collaboration.md
      - Python SDK: sdk.md
      - Observability: observability.md
      - Deployment (Docker + Helm): deployment.md
  - Changelog: changelog.md
